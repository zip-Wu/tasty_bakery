<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- 顶部两个小铃铛 -->
  <circle cx="12" cy="10" r="3" fill="#8B4513"/>
  <circle cx="36" cy="10" r="3" fill="#8B4513"/>
  <!-- 顶部连接杆 -->
  <rect x="14" y="10" width="20" height="3" rx="1.5" fill="#8B4513"/>
  <!-- 表盘外圈 -->
  <circle cx="24" cy="28" r="14" fill="none" stroke="#8B4513" stroke-width="2.5"/>
  <!-- 12/3/6/9 刻度 -->
  <line x1="24" y1="14.5" x2="24" y2="17" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <line x1="37.5" y1="28" x2="35" y2="28" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="41.5" x2="24" y2="39" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <line x1="10.5" y1="28" x2="13" y2="28" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <!-- 时针指 11（提示"快到时间"） -->
  <line x1="24" y1="28" x2="18" y2="20" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 分针指 12 -->
  <line x1="24" y1="28" x2="24" y2="17" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 中心点 -->
  <circle cx="24" cy="28" r="2" fill="#8B4513"/>
  <!-- 底部支脚 -->
  <line x1="14" y1="40" x2="10" y2="44" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="40" x2="38" y2="44" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round"/>
</svg>